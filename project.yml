name: BlackOutMobile
options:
  bundleIdPrefix: com.blackout
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.41.1
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  BlackOutMobile:
    type: application
    platform: iOS
    sources:
      - path: BlackOutMobile
    dependencies:
      - package: Supabase
    settings:
      base:
        INFOPLIST_FILE: BlackOutMobile/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.blackout.mobile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
